[project]
name = "shaleyeah-mcp-client"
version = "0.3.0"
description = "Portable configured MCP HTTP client for independent employee packages"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["shaleyeah-contracts==0.3.0", "mcp==2.3.0", "httpx2==2.13.1", "anyio==4.14.2", "jsonschema==4.26.0"]

[tool.uv.sources]
shaleyeah-contracts = { path = "../../contracts", editable = true }

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaleyeah_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
