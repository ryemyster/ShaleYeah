name: CI

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reference-qualification:
    uses: ./.github/workflows/reference-qualification.yml
  qa-observed-qualification:
    name: QA observed result qualification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm --dir contracts build
    - run: pnpm --dir sdk build
    - run: pnpm --dir servers/qa-server build
    - run: pnpm --dir servers/qa-server type-check
    - run: pnpm --dir servers/qa-server lint
    - run: pnpm --dir servers/qa-server test:coverage
    - name: Configured observed-result scorecard
      run: pnpm --dir servers/qa-server qualify --report /tmp/qa-scorecard.json
    - name: Independent source and installed archive
      run: node servers/qa-server/scripts/check-extraction.mjs --report /tmp/qa-extraction.json
    - name: Installed non-root Node container
      run: node servers/qa-server/scripts/check-containers.mjs --report /tmp/qa-container.json
    - name: Publish QA decision metadata
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-observed-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          /tmp/qa-scorecard.json
          /tmp/qa-extraction.json
          /tmp/qa-container.json
        if-no-files-found: error
        retention-days: 14
  pr-checks:
    name: PR checks
    needs: [reference-qualification, qa-observed-qualification]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22.x'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
    - name: Setup uv for contract parity checks
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: '0.12.21'
        python-version: '3.12'
    - run: pnpm check:issue-template
    - run: pnpm test:sdlc
    - name: Sequential develop delivery
      if: github.event_name == 'pull_request' && github.base_ref == 'develop'
      env:
        GH_TOKEN: ${{ github.token }}
        SDLC_PR: ${{ github.event.pull_request.number }}
      run: node scripts/sdlc.mjs ci "$SDLC_PR"
    - run: pnpm turbo type-check
    - run: pnpm turbo lint
    - run: pnpm turbo build
    - name: Install Reporter native runtime for protocol and context controls
      run: uv sync --project agents/reporter-agent --locked
    - name: Workspace tests on the constrained runner
      run: pnpm turbo test --concurrency=2
    - run: pnpm --dir contracts check:isolation
    - run: pnpm --dir connectors check:isolation
    - name: Native model adapter coverage
      working-directory: sdk
      run: pnpm exec tsx --test --experimental-test-coverage --test-coverage-include=src/model-provider.ts --test-coverage-lines=90 tests/model-provider.test.ts
