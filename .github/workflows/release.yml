name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-qualification:
    uses: ./.github/workflows/reference-qualification.yml
  release:
    name: Build release package
    runs-on: ubuntu-latest
    environment: production
    needs: reference-qualification

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
      with:
        node-version: '22.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Setup uv for protected reference tests
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.21'
        python-version: '3.12'

    - name: Run release checks
      run: |
        pnpm turbo type-check
        pnpm turbo lint
        pnpm turbo build
        pnpm turbo test

    - name: Create release package
      run: |
        mkdir -p dist
        cat > dist/QUALIFICATION.txt <<'EOF'
        Qualification: Geologist/Geowiz offline reference fixture conformance only.
        Public LAS bytes, authored employee outputs and scripted qualitative judge.
        Live providers, scientific correctness, other roles and human MVP acceptance
        require separate evidence. A green build does not certify the whole product.
        EOF
        printf 'Tested code revision: %s\n' "$GITHUB_SHA" >> dist/QUALIFICATION.txt
        REF_NAME="${GITHUB_REF_NAME//\//-}"
        tar -czf "dist/shale-yeah-${REF_NAME}.tar.gz" \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=dist \
          --exclude=.venv \
          --exclude=__pycache__ \
          --exclude=artifacts \
          --exclude=data/temp \
          --exclude=data/outputs/reports \
          --exclude=data/outputs/models \
          .

    - name: Generate artifact hash
      run: sha256sum dist/* | tee dist/SHA256SUMS.txt

    - name: Upload release assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: release-assets
        path: dist/
        if-no-files-found: error
