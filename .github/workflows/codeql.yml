name: CodeQL Security Analysis
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 3am UTC
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@480db559a14342288b67e54bd959dd52dc3ee68f  # v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@480db559a14342288b67e54bd959dd52dc3ee68f  # v3
