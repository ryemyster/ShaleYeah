name: CodeQL Security Analysis
on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 3am UTC
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: { security-events: write, actions: read, contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - uses: github/codeql-action/init@480db559a14342288b67e54bd959dd52dc3ee68f  # v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@480db559a14342288b67e54bd959dd52dc3ee68f  # v3