[project]
name = "shaleyeah-evaluations"
version = "0.2.1"
description = "Portable employee evaluation profiles and trusted deterministic metrics"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["shaleyeah-contracts==0.3.0", "jsonschema==4.26.0", "rfc8785==0.1.4"]

[dependency-groups]
dev = ["pytest>=9.0.2,<10", "pytest-cov>=7,<8", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaleyeah_evaluations"]

[tool.uv.sources]
shaleyeah-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
