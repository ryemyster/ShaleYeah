[project]
name = "shaleyeah-legal-analyst-adk"
version = "0.1.0"
description = "Source-cited legal issue memo employee with exact human review"
authors = [
  { name = "Ryan McDonald" },
]
dependencies = [
  "shaleyeah-contracts==0.3.0",
  "shaleyeah-evaluations==0.3.0",
  "shaleyeah-mcp-client==0.3.0",
  "shaleyeah-employee-runtime[adk]==0.1.0",
  "httpx==0.28.1",
]
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[project.optional-dependencies]
lint = [
  "ruff>=0.4.6,<1.0.0",
  "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
shaleyeah-mcp-client = { path = "../../sdk/python", editable = true }
shaleyeah-contracts = { path = "../../contracts", editable = true }
shaleyeah-evaluations = { path = "../../evaluations", editable = true }
shaleyeah-employee-runtime = { path = "../../sdk/employee", editable = true }
