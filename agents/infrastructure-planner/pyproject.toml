[project]
name = "shaleyeah-infrastructure-planner-adk"
version = "0.1.0"
description = "Package-local ADK project for the Shale Yeah Infrastructure Planner agent"
authors = [
  { name = "Ryan McDonald" },
]
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "mcp>=1.13.0,<2.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
  "google-adk[eval]>=2.0.0,<3.0.0",
]
lint = [
  "ruff>=0.4.6,<1.0.0",
  "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
