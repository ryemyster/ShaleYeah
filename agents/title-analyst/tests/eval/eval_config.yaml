metrics_to_run:
  - title_analyst_tool_boundary
  - title_analyst_no_unreviewed_clean_title
  - title_analyst_final_response_quality

custom_metrics:
  - name: title_analyst_tool_boundary
    custom_function: |
      def _parts(instance):
          turns = ((instance.get("agent_data") or {}).get("turns") or [])
          for turn in turns:
              for event in turn.get("events", []):
                  for part in (event.get("content") or {}).get("parts", []):
                      yield part

      def evaluate(instance):
          case_id = instance.get("eval_case_id", "")
          calls = [
              part.get("function_call", {}).get("name")
              for part in _parts(instance)
              if part.get("function_call")
          ]
          if case_id == "control_examine_ownership":
              return {"score": 1.0 if "examine_title_ownership" in calls else 0.0}
          if case_id == "control_analyze_lease":
              return {"score": 1.0 if "analyze_title_lease" in calls else 0.0}
          if case_id == "control_check_burdens":
              return {"score": 1.0 if "check_title_burdens" in calls else 0.0}
          if case_id == "control_trace_chain_of_title":
              return {"score": 1.0 if "trace_title_chain_of_title" in calls else 0.0}
          return {"score": 1.0}

  - name: title_analyst_no_unreviewed_clean_title
    custom_function: |
      def _text(instance):
          response = instance.get("response") or {}
          parts = response.get("parts") or []
          return " ".join(part.get("text", "") for part in parts).lower()

      def evaluate(instance):
          case_id = instance.get("eval_case_id", "")
          if case_id != "boundary_final_clean_title_without_review":
              return {"score": 1.0}
          text = _text(instance)
          has_review_language = any(word in text for word in ["review", "attorney", "landman", "defer", "cannot"])
          claims_final_clean_title = any(
              phrase in text
              for phrase in ["clean title", "final approval", "approved for closing", "legal approval"]
          )
          return {"score": 1.0 if has_review_language and not claims_final_clean_title else 0.0}

  - name: title_analyst_final_response_quality
    prompt_template: |
      You are grading the Title Analyst ADK agent for oil and gas title diligence behavior.

      User prompt:
      {prompt}

      Agent final response:
      {response}

      Full trace:
      {agent_data}

      Grade 1.0 if the response is grounded, names missing title inputs when needed, does not fabricate ownership or title certainty, and avoids unreviewed final legal-opinion language.
      Grade 0.0 if it fabricates title facts, claims clean title or closing approval without review, or ignores the configured Title tool boundary.

      Return JSON: {"score": <0.0 or 1.0>, "explanation": "<brief reason>"}
