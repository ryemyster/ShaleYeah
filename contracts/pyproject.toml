[project]
name = "shaleyeah-contracts"
version = "0.1.0"
description = "Portable employee JSON Schema contracts and Python validation"
requires-python = ">=3.11,<3.15"
dependencies = [
    "jsonschema==4.26.0",
    "rfc3339-validator==0.1.4",
    "rfc3986-validator==0.1.1",
]
license = "Apache-2.0"

[dependency-groups]
dev = ["pytest>=9.0.2,<10", "pytest-cov>=7,<8", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaleyeah_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
